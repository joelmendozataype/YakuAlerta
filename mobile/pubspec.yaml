name: yakualerta
description: App móvil offline-first del operador JASS — YakuAlerta (Hackathon UNH 2026).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Persistencia local offline-first
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  # Red / sincronización
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  # Identificadores de deduplicación
  uuid: ^4.4.2
  # Cámara DPD y evidencia georreferenciada (HU-05, HU-08)
  camera: ^0.11.0
  geolocator: ^13.0.1
  image: ^4.2.0
  # Recordatorios locales sin internet (HU-07)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
