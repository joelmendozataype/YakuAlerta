# Memoria acotada: con 8G el build competía con el emulador y el sistema lo
# terminaba a mitad de la instalación. 3G basta para este proyecto.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Desactiva la compilacion incremental de Kotlin: evita la corrupcion de
# cachas incrementales (.tab) en Windows. Build reproducible y estable.
kotlin.incremental=false
org.gradle.caching=false
